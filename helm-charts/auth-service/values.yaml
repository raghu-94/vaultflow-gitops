replicaCount: 1
deployment:
  enabled: true   # toggle off once a Rollout owns the pods instead (see Phase 6)
image:
  repository: 274394226013.dkr.ecr.ap-south-1.amazonaws.com/auth-service
  tag: ""       # CI/CD injects the git SHA here automatically
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000
rbac:
  enabled: true
networkPolicy:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
version: blue       # blue or green — for blue/green deployment
autoscaling:
  enabled: false   # default off — only prod turns this on
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
